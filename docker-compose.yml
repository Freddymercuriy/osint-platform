version: "2.4"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Faqat shu kompyuterdan — LAN/VPN'dan ko'rinmaydi
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        DEV: "1"  # pytest ham o'rnatiladi (lokal ishlab chiqish)
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://osint:osint@db:5432/osint
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Barcha interfeyslarda: localhost va LAN (http://192.168.1.50:8000). Internetga ochish kerak bo'lsa —
      # reverse proxy + HTTPS orqali (TRUSTED_PROXIES). DB porti esa faqat shu kompyuterda qoladi.
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres-data:
