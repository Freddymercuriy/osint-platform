version: "2.4"

# restart: unless-stopped — Docker (docker.service) ishga tushganda konteynerlar ham ko'tariladi, kompyuter qayta
# yoqilganda ham. Qo'lda to'xtatilgani (docker-compose stop X) esa to'xtaganicha qoladi.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Faqat shu kompyuterdan — LAN/VPN'dan ko'rinmaydi
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        DEV: "1"  # pytest ham o'rnatiladi (lokal ishlab chiqish)
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://osint:osint@db:5432/osint
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Barcha interfeyslarda: localhost va LAN (http://<LAN-IP>:8000). ⚠️ Docker chiqargan portlar ufw'ni chetlab
      # o'tadi — faqat shu kompyuterdan kerak bo'lsa "127.0.0.1:8000:8000". DB porti faqat shu kompyuterda qoladi.
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend:/app

  # Frontend — production build (next build, standalone). Ishlab chiqishda: docker-compose stop frontend &&
  # (cd frontend && npm run dev); tugagach: docker-compose start frontend.
  # NEXT_PUBLIC_API_URL build vaqtida kodga yoziladi — loyiha ildizidagi .env dan (git'da yo'q); o'zgarsa:
  # docker-compose build frontend && docker-compose stop frontend && docker-compose rm -f frontend && docker-compose up -d frontend
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"  # localhost va LAN (http://<LAN-IP>:3000); faqat shu kompyuter — "127.0.0.1:3000:3000"

volumes:
  postgres-data:
